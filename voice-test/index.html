<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paola Piper Complete Test</title>
<style>
body{font-family:system-ui,-apple-system,sans-serif;max-width:760px;margin:auto;padding:24px;background:#0b1020;color:#eef2ff}
textarea{width:100%;min-height:110px;box-sizing:border-box;padding:14px;border-radius:12px;font:inherit}
button{padding:14px 18px;margin-top:12px;border:0;border-radius:12px;font:inherit;font-weight:700}
#log{margin-top:18px;white-space:pre-wrap;background:#111827;padding:14px;border-radius:12px;min-height:140px;font:13px ui-monospace,monospace}
audio{width:100%;margin-top:16px}
</style></head>
<body>
<h1>🎙️ Paola · Piper CDN + asset locali</h1>
<p>Questa pagina carica la libreria JavaScript da jsDelivr e usa i tuoi asset WASM/ONNX locali.</p>
<textarea id="text">Uno. Due. Tre. Tieni i gomiti più vicini al corpo.</textarea>
<br><button id="go">GENERA E PARLA</button>
<div id="log">Pronto.</div><div id="player"></div>

<script type="module">
import {
  PiperWebEngine, OnnxWebRuntime, PhonemizeWebRuntime, HuggingFaceVoiceProvider
} from "https://cdn.jsdelivr.net/npm/piper-tts-web@1.1.2/+esm";

const logEl=document.querySelector("#log"), btn=document.querySelector("#go"), player=document.querySelector("#player");
const log=(m)=>{logEl.textContent+="\n• "+m;logEl.scrollTop=logEl.scrollHeight};

const engine=new PiperWebEngine({
  onnxRuntime:new OnnxWebRuntime({basePath:"./onnx/",numThreads:1}),
  phonemizeRuntime:new PhonemizeWebRuntime({basePath:"./piper/"}),
  voiceProvider:new HuggingFaceVoiceProvider()
});

btn.onclick=async()=>{
 btn.disabled=true; player.innerHTML=""; logEl.textContent="Avvio pipeline Piper completa…";
 try{
   log("Voce: it_IT-paola-medium");
   log("Fonemizzazione italiana + download modello + inferenza ONNX…");
   const t=performance.now();
   const response=await engine.generate(
     document.querySelector("#text").value,
     "it_IT-paola-medium",
     0
   );
   log("WAV generato in "+((performance.now()-t)/1000).toFixed(1)+" s");
   log("Durata audio: "+(response.duration/1000).toFixed(2)+" s");
   const url=URL.createObjectURL(response.file);
   const audio=document.createElement("audio");
   audio.controls=true; audio.autoplay=true; audio.src=url;
   audio.onplay=()=>log("🔊 AUDIO IN RIPRODUZIONE");
   audio.onerror=()=>log("❌ Errore riproduzione audio");
   audio.onended=()=>log("✓ Audio completato");
   player.appendChild(audio);
   await audio.play();
 }catch(e){
   console.error(e);
   log("❌ ERRORE: "+(e?.stack||e?.message||String(e)));
 }finally{btn.disabled=false}
};
</script>
</body></html>
