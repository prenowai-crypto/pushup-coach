<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pose Model Lab · MediaPipe vs RTMW</title>
<style>
body{margin:0;background:#07111f;color:#eef6ff;font:15px system-ui;padding:14px}h1{font-size:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:#0d1b2c;border:1px solid #27415f;border-radius:14px;padding:10px}.stage{position:relative;aspect-ratio:3/4;background:#02070c;border-radius:10px;overflow:hidden}video,canvas{position:absolute;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}canvas{z-index:2}button{font-size:16px;padding:12px 18px;border:0;border-radius:10px;font-weight:700}.stats{line-height:1.6;font-variant-numeric:tabular-nums}.ok{color:#62e6a7}.warn{color:#ffd166}.bad{color:#ff7474}@media(max-width:760px){.grid{grid-template-columns:1fr}.stage{aspect-ratio:4/3}}</style>
</head><body>
<h1>🧪 Pose Model Lab · MediaPipe vs RTMW 133</h1>
<p>Stessa camera, due tracker. Mettiti al centro e prova curl alternato, simultaneo, frontale, 45° e laterale.</p>
<button id="start">AVVIA TEST</button> <span id="global">Pronto.</span>
<div class="grid">
<section class="card"><h2>MediaPipe Pose</h2><div class="stage"><video id="v1" autoplay muted playsinline></video><canvas id="c1"></canvas></div><div class="stats" id="s1">—</div></section>
<section class="card"><h2>RTMW-m WholeBody · 133 keypoint</h2><div class="stage"><video id="v2" autoplay muted playsinline></video><canvas id="c2"></canvas></div><div class="stats" id="s2">—</div></section>
</div>
<script type="module">
import {FilesetResolver,PoseLandmarker,DrawingUtils} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.32/+esm";
import {loadLiteRt,loadAndCompile,Tensor} from "https://cdn.jsdelivr.net/npm/@litertjs/core@2.5.3/+esm";

const $=x=>document.getElementById(x), v1=$("v1"),v2=$("v2"),c1=$("c1"),c2=$("c2"),x1=c1.getContext("2d"),x2=c2.getContext("2d");
let mp=null,rt=null,running=false,lastMP=0,lastRT=0,mpN=0,rtN=0,mpT=performance.now(),rtT=performance.now(),busy=false;
const MODEL="https://huggingface.co/litert-community/RTMW-m-WholeBody-LiteRT/resolve/main/rtmw_fp16.tflite";
const mean=[123.675,116.28,103.53],std=[58.395,57.12,57.375];
const BODY_EDGES=[[5,7],[7,9],[6,8],[8,10],[5,6],[5,11],[6,12],[11,12],[11,13],[13,15],[12,14],[14,16]];
function ang(a,b,c){let u=[a[0]-b[0],a[1]-b[1]],v=[c[0]-b[0],c[1]-b[1]];let d=Math.hypot(...u)*Math.hypot(...v);return d?Math.acos(Math.max(-1,Math.min(1,(u[0]*v[0]+u[1]*v[1])/d)))*180/Math.PI:NaN}
function fps(which){let now=performance.now();if(which==="mp"){mpN++;if(now-mpT>1000){lastMP=mpN*1000/(now-mpT);mpN=0;mpT=now}}else{rtN++;if(now-rtT>1000){lastRT=rtN*1000/(now-rtT);rtN=0;rtT=now}}}
function prepRT(video){
 const w=video.videoWidth,h=video.videoHeight, target=3/4; let sx=0,sy=0,sw=w,sh=h;
 if(w/h>target){sw=h*target;sx=(w-sw)/2}else{sh=w/target;sy=(h-sh)/2}
 const q=document.createElement("canvas");q.width=192;q.height=256;const qx=q.getContext("2d",{willReadFrequently:true});qx.drawImage(video,sx,sy,sw,sh,0,0,192,256);
 const im=qx.getImageData(0,0,192,256).data,out=new Float32Array(3*192*256),plane=192*256;
 for(let i=0;i<plane;i++){out[i]=(im[i*4]-mean[0])/std[0];out[plane+i]=(im[i*4+1]-mean[1])/std[1];out[2*plane+i]=(im[i*4+2]-mean[2])/std[2]}
 return {tensor:new Tensor(out,[1,3,256,192]),crop:[sx,sy,sw,sh]};
}
function decode(arrX,arrY,crop,W,H){
 const pts=[];let avg=0;
 for(let k=0;k<133;k++){let bx=0,by=0,mx=-Infinity,my=-Infinity;for(let j=0;j<384;j++){let z=arrX[k*384+j];if(z>mx){mx=z;bx=j}}for(let j=0;j<512;j++){let z=arrY[k*512+j];if(z>my){my=z;by=j}}
   let px=bx/2,py=by/2;let X=(crop[0]+px/192*crop[2])/W,Y=(crop[1]+py/256*crop[3])/H;let conf=Math.min(mx,my);avg+=conf;pts.push([X,Y,conf]);
 } return {pts,avg:avg/133};
}
function drawRT(d){
 c2.width=v2.videoWidth;c2.height=v2.videoHeight;x2.clearRect(0,0,c2.width,c2.height);const p=d.pts;
 x2.lineWidth=4;x2.strokeStyle="#4de3ff";for(const [a,b] of BODY_EDGES){x2.beginPath();x2.moveTo(p[a][0]*c2.width,p[a][1]*c2.height);x2.lineTo(p[b][0]*c2.width,p[b][1]*c2.height);x2.stroke()}
 for(let i=0;i<133;i++){x2.fillStyle=i>=91?"#ffd166":"#62e6a7";x2.beginPath();x2.arc(p[i][0]*c2.width,p[i][1]*c2.height,i<17?4:2,0,7);x2.fill()}
 let L=ang(p[5],p[7],p[9]),R=ang(p[6],p[8],p[10]);$("s2").innerHTML=`FPS inferenza: <b>${lastRT.toFixed(1)}</b><br>Gomito SX: <b>${L.toFixed(1)}°</b> · DX: <b>${R.toFixed(1)}°</b><br>Keypoint: <b>133</b> (corpo+piedi+viso+mani)<br>Output confidence grezza media: ${d.avg.toFixed(2)}`;
}
async function runRT(){
 if(!rt||busy||!running)return;busy=true;
 try{const P=prepRT(v2),res=await rt.run(P.tensor);P.tensor.delete();let a=await res[0].data(),b=await res[1].data();for(const z of res)z.delete();let sx=a.length===133*384?a:b,sy=a.length===133*512?a:b;drawRT(decode(sx,sy,P.crop,v2.videoWidth,v2.videoHeight));fps("rt")}
 catch(e){$("s2").innerHTML=`<span class=bad>RTMW errore: ${e.message}</span>`}finally{busy=false}
}
function runMP(now){
 if(!mp||!running)return;let r=mp.detectForVideo(v1,now);c1.width=v1.videoWidth;c1.height=v1.videoHeight;x1.clearRect(0,0,c1.width,c1.height);
 if(r.landmarks?.[0]){let lm=r.landmarks[0],du=new DrawingUtils(x1);du.drawConnectors(lm,PoseLandmarker.POSE_CONNECTIONS,{color:"#4de3ff",lineWidth:4});du.drawLandmarks(lm,{color:"#62e6a7",radius:3});
 let A=(a,b,c)=>ang([lm[a].x,lm[a].y],[lm[b].x,lm[b].y],[lm[c].x,lm[c].y]);$("s1").innerHTML=`FPS inferenza: <b>${lastMP.toFixed(1)}</b><br>Gomito SX: <b>${A(11,13,15).toFixed(1)}°</b> · DX: <b>${A(12,14,16).toFixed(1)}°</b><br>Landmark corpo: <b>33</b>`;fps("mp")}
}
async function loop(t){if(!running)return;runMP(t);if(t-lastRT>0)runRT();requestAnimationFrame(loop)}
$("start").onclick=async()=>{
 $("start").disabled=true;$("global").textContent="Camera…";
 const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:960},height:{ideal:1280}},audio:false});v1.srcObject=stream;v2.srcObject=stream;await Promise.all([v1.play(),v2.play()]);
 $("global").textContent="Carico MediaPipe…";const vis=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.32/wasm");
 mp=await PoseLandmarker.createFromOptions(vis,{baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",delegate:"GPU"},runningMode:"VIDEO",numPoses:1});
 $("global").textContent="Carico LiteRT + RTMW (~66 MB)…";
 await loadLiteRt("https://cdn.jsdelivr.net/npm/@litertjs/core@2.5.3/wasm/");
 try{rt=await loadAndCompile(MODEL,{accelerator:"webgpu"});$("global").innerHTML="<span class=ok>RTMW WebGPU pronto ✓</span>"}
 catch(e){$("global").innerHTML="<span class=warn>WebGPU non disponibile; provo WASM…</span>";try{rt=await loadAndCompile(MODEL,{accelerator:"wasm"});$("global").innerHTML="<span class=warn>RTMW WASM pronto (potrebbe essere lento)</span>"}catch(e2){$("global").innerHTML="<span class=bad>RTMW non avviato: "+e2.message+"</span>"}}
 running=true;requestAnimationFrame(loop);
};
</script></body></html>
