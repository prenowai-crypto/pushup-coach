<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MediaPipe Pose Model Lab · Lite Full Heavy</title>
<style>
body{margin:0;background:#07111f;color:#eef6ff;font:15px system-ui;padding:14px}h1{font-size:21px}
.controls,.card{background:#0d1b2c;border:1px solid #29425e;border-radius:14px;padding:12px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stage{position:relative;aspect-ratio:4/3;background:#02070c;border-radius:10px;overflow:hidden}
video,canvas{position:absolute;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}canvas{z-index:2}
button{padding:12px 18px;border:0;border-radius:10px;font-weight:800;font-size:16px}.stats{line-height:1.55;font-variant-numeric:tabular-nums}
.ok{color:#62e6a7}.warn{color:#ffd166}.bad{color:#ff7474}.title{font-size:18px;font-weight:800;margin-bottom:8px}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
</style></head>
<body>
<h1>🧪 MediaPipe Pose Model Lab · Lite vs Full vs Heavy</h1>
<div class="controls"><button id="go">AVVIA CONFRONTO</button> <span id="status">Pronto.</span>
<p>Test: curl alternato frontale → simultaneo → 45° → laterale. Guarda soprattutto stabilità SX/DX, jitter, World 3D e FPS.</p></div>
<div class="grid">
<div class="card"><div class="title">LITE</div><div class="stage"><video id="v1" autoplay muted playsinline></video><canvas id="c1"></canvas></div><div id="s1" class="stats">—</div></div>
<div class="card"><div class="title">FULL</div><div class="stage"><video id="v2" autoplay muted playsinline></video><canvas id="c2"></canvas></div><div id="s2" class="stats">—</div></div>
<div class="card"><div class="title">HEAVY</div><div class="stage"><video id="v3" autoplay muted playsinline></video><canvas id="c3"></canvas></div><div id="s3" class="stats">—</div></div>
</div>
<script type="module">
import {FilesetResolver,PoseLandmarker,DrawingUtils} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.32/+esm";
const $=x=>document.getElementById(x);
const vids=[$("v1"),$("v2"),$("v3")], cvs=[$("c1"),$("c2"),$("c3")], sts=[$("s1"),$("s2"),$("s3")];
const urls=[
"https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
"https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/1/pose_landmarker_full.task",
"https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_heavy/float16/1/pose_landmarker_heavy.task"];
let models=[],running=false,idx=0,last=0,counts=[0,0,0],ticks=[performance.now(),performance.now(),performance.now()],fps=[0,0,0],prev=[null,null,null],jitter=[0,0,0];
function angle(a,b,c){let u=[a.x-b.x,a.y-b.y,a.z-b.z],v=[c.x-b.x,c.y-b.y,c.z-b.z],d=Math.hypot(...u)*Math.hypot(...v);return d?Math.acos(Math.max(-1,Math.min(1,(u[0]*v[0]+u[1]*v[1]+u[2]*v[2])/d)))*180/Math.PI:NaN}
function run(i,t){
 let r=models[i].detectForVideo(vids[i],t), lm=r.landmarks?.[0], w=r.worldLandmarks?.[0], ctx=cvs[i].getContext("2d");
 cvs[i].width=vids[i].videoWidth;cvs[i].height=vids[i].videoHeight;ctx.clearRect(0,0,cvs[i].width,cvs[i].height);
 if(!lm){sts[i].innerHTML='<span class=bad>Nessuna posa</span>';return}
 let du=new DrawingUtils(ctx);du.drawConnectors(lm,PoseLandmarker.POSE_CONNECTIONS,{color:"#4de3ff",lineWidth:4});du.drawLandmarks(lm,{color:"#62e6a7",radius:3});
 let src=w||lm,L=angle(src[11],src[13],src[15]),R=angle(src[12],src[14],src[16]);
 if(prev[i]){let d=Math.hypot(lm[13].x-prev[i][0],lm[13].y-prev[i][1])+Math.hypot(lm[14].x-prev[i][2],lm[14].y-prev[i][3]);jitter[i]=jitter[i]*.9+d*.1}
 prev[i]=[lm[13].x,lm[13].y,lm[14].x,lm[14].y];counts[i]++;let now=performance.now();
 if(now-ticks[i]>1000){fps[i]=counts[i]*1000/(now-ticks[i]);counts[i]=0;ticks[i]=now}
 let vis=((lm[11].visibility+lm[12].visibility+lm[13].visibility+lm[14].visibility+lm[15].visibility+lm[16].visibility)/6)*100;
 sts[i].innerHTML=`FPS modello: <b>${fps[i].toFixed(1)}</b><br>WORLD 3D: <b>${w?"SÌ ✓":"NO"}</b><br>Gomito SX: <b>${L.toFixed(1)}°</b> · DX: <b>${R.toFixed(1)}°</b><br>Visibility braccia: <b>${vis.toFixed(0)}%</b><br>Jitter grezzo: <b>${jitter[i].toFixed(4)}</b>`;
}
function loop(t){if(!running)return;
 // round-robin: un'inferenza per animation frame per non triplicare il carico nello stesso frame
 run(idx,t);idx=(idx+1)%3;requestAnimationFrame(loop)}
$("go").onclick=async()=>{
 try{$("go").disabled=true;$("status").textContent="Camera…";
 let stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:960},height:{ideal:1280}},audio:false});
 for(let v of vids){v.srcObject=stream;await v.play()}
 $("status").textContent="Carico MediaPipe e i 3 modelli…";
 let fs=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.32/wasm");
 for(let i=0;i<3;i++){ $("status").textContent=`Carico ${["Lite","Full","Heavy"][i]}…`;
   let m;try{m=await PoseLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:urls[i],delegate:"GPU"},runningMode:"VIDEO",numPoses:1})}
   catch(e){m=await PoseLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:urls[i],delegate:"CPU"},runningMode:"VIDEO",numPoses:1})}
   models.push(m);
 }
 $("status").innerHTML='<span class=ok>TUTTI I MODELLI PRONTI ✓</span>';running=true;requestAnimationFrame(loop);
 }catch(e){$("status").innerHTML='<span class=bad>'+e.message+'</span>';$("go").disabled=false}
};
</script></body></html>
