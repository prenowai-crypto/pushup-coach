<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RTMW3D Body Lab</title><style>
body{margin:0;background:#07111f;color:#eef6ff;font:15px system-ui;padding:14px}h1{font-size:21px}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:12px}.card{background:#0d1b2c;border:1px solid #29425e;border-radius:14px;padding:10px}.stage{position:relative;aspect-ratio:4/3;background:#02070c;border-radius:10px;overflow:hidden}video,canvas{position:absolute;width:100%;height:100%;object-fit:cover}#ov{transform:scaleX(-1)}video{transform:scaleX(-1)}button{padding:12px 18px;border:0;border-radius:10px;font-weight:800;font-size:16px}.stats{font-variant-numeric:tabular-nums;line-height:1.65}.ok{color:#62e6a7}.warn{color:#ffd166}.bad{color:#ff7474}table{width:100%;border-collapse:collapse}td,th{padding:5px;border-bottom:1px solid #22364e;text-align:right}td:first-child,th:first-child{text-align:left}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body>
<h1>🧪 RTMW3D Body Lab · 133 keypoint 3D</h1><p>Test isolato: verifica stabilità DX/SX e profondità durante curl frontale, alternato, simultaneo e a 45°.</p>
<button id="go">AVVIA RTMW3D</button> <span id="status">Pronto.</span>
<div class="grid"><div class="card"><div class="stage"><video id="v" autoplay muted playsinline></video><canvas id="ov"></canvas></div><div class="stats" id="perf">—</div></div>
<div class="card"><h3>Braccia · coordinate 3D relative</h3><table><thead><tr><th>Punto</th><th>X</th><th>Y</th><th>Z</th></tr></thead><tbody id="tbl"></tbody></table>
<h3>Diagnostica</h3><div class="stats" id="diag">—</div><canvas id="plot" width="500" height="350" style="width:100%;background:#06101b;border-radius:10px"></canvas></div></div>
<script type="module">
import * as ort from "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/+esm";
ort.env.wasm.numThreads=1; ort.env.wasm.wasmPaths="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/";
const MODEL="https://huggingface.co/Soykaf/RTMW3D-x/resolve/main/onnx/rtmw3d-x_8xb64_cocktail14-384x288-b0a0eab7_20240626.onnx";
const $=x=>document.getElementById(x),v=$("v"),cv=$("ov"),cx=cv.getContext("2d"),pc=$("plot"),px=pc.getContext("2d");
let ses,running=false,busy=false,n=0,t0=performance.now(),fps=0,lastPts=null;
const names=["naso","occhio SX","occhio DX","orecchio SX","orecchio DX","spalla SX","spalla DX","gomito SX","gomito DX","polso SX","polso DX","anca SX","anca DX","ginocchio SX","ginocchio DX","caviglia SX","caviglia DX"];
const edges=[[5,6],[5,7],[7,9],[6,8],[8,10],[5,11],[6,12],[11,12],[11,13],[13,15],[12,14],[14,16]];
function crop(){let w=v.videoWidth,h=v.videoHeight,r=288/384,sx=0,sy=0,sw=w,sh=h;if(w/h>r){sw=h*r;sx=(w-sw)/2}else{sh=w/r;sy=(h-sh)/2}return[sx,sy,sw,sh]}
function input(){let C=crop(),q=document.createElement("canvas");q.width=288;q.height=384;let g=q.getContext("2d",{willReadFrequently:true});g.drawImage(v,...C,0,0,288,384);let im=g.getImageData(0,0,288,384).data,a=new Float32Array(3*288*384),P=288*384,m=[123.675,116.28,103.53],s=[58.395,57.12,57.375];for(let i=0;i<P;i++){a[i]=(im[4*i]-m[0])/s[0];a[P+i]=(im[4*i+1]-m[1])/s[1];a[2*P+i]=(im[4*i+2]-m[2])/s[2]}return{t:new ort.Tensor("float32",a,[1,3,384,288]),C}}
function arg(a,o,len){let bi=0,b=-1e30;for(let i=0;i<len;i++){let z=a[o+i];if(z>b){b=z;bi=i}}return[bi,b]}
function decode(out,C){
 let A=Object.values(out).map(x=>x.data), X=A.find(a=>a.length===133*576),Y=A.find(a=>a.length===133*768),Z=A.filter(a=>a.length===133*576).find(a=>a!==X);
 if(!X||!Y||!Z){let lens=A.map(a=>a.length).join(",");throw Error("Output inattesi: "+lens)}
 let p=[];for(let k=0;k<133;k++){let [ix,sx]=arg(X,k*576,576),[iy,sy]=arg(Y,k*768,768),[iz,sz]=arg(Z,k*576,576);
 let x=ix/2,y=iy/2,z=(iz-288)/2; p.push({x:(C[0]+x/288*C[2])/v.videoWidth,y:(C[1]+y/384*C[3])/v.videoHeight,z:z/384,score:Math.min(sx,sy,sz)})}return p
}
function draw(p){cv.width=v.videoWidth;cv.height=v.videoHeight;cx.clearRect(0,0,cv.width,cv.height);cx.lineWidth=5;cx.strokeStyle="#4de3ff";for(let e of edges){cx.beginPath();cx.moveTo(p[e[0]].x*cv.width,p[e[0]].y*cv.height);cx.lineTo(p[e[1]].x*cv.width,p[e[1]].y*cv.height);cx.stroke()}for(let i=0;i<17;i++){cx.fillStyle=i%2?"#62e6a7":"#ffd166";cx.beginPath();cx.arc(p[i].x*cv.width,p[i].y*cv.height,5,0,7);cx.fill()}
 let ids=[5,6,7,8,9,10],rows="";for(let i of ids)rows+=`<tr><td>${names[i]}</td><td>${p[i].x.toFixed(3)}</td><td>${p[i].y.toFixed(3)}</td><td>${p[i].z.toFixed(3)}</td></tr>`;$("tbl").innerHTML=rows;
 $("diag").innerHTML=`ΔZ gomiti SX/DX: <b>${Math.abs(p[7].z-p[8].z).toFixed(3)}</b><br>ΔZ polsi SX/DX: <b>${Math.abs(p[9].z-p[10].z).toFixed(3)}</b><br>Obiettivo: i lati devono restare coerenti mentre alterni le braccia.`;
 draw3(p)
}
function draw3(p){px.clearRect(0,0,pc.width,pc.height);let sc=330,ox=250,oy=170;function Q(a){return[ox+(a.x-.5)*sc,oy+(a.z)*sc+(a.y-.5)*100]}px.lineWidth=4;px.strokeStyle="#4de3ff";for(let e of edges){let a=Q(p[e[0]]),b=Q(p[e[1]]);px.beginPath();px.moveTo(...a);px.lineTo(...b);px.stroke()}for(let i=0;i<17;i++){let a=Q(p[i]);px.fillStyle="#62e6a7";px.beginPath();px.arc(...a,4,0,7);px.fill()}}
async function step(){if(!running){return}if(!busy){busy=true;let st=performance.now();try{let I=input(),feed={};feed[ses.inputNames[0]]=I.t;let o=await ses.run(feed);I.t.dispose?.();lastPts=decode(o,I.C);draw(lastPts);n++;let now=performance.now();if(now-t0>1000){fps=n*1000/(now-t0);n=0;t0=now}$("perf").innerHTML=`Inferenza: <b>${(performance.now()-st).toFixed(0)} ms</b> · FPS: <b>${fps.toFixed(1)}</b><br>Modello: RTMW3D-x · 369 MB · ONNX Runtime Web`;}catch(e){$("status").innerHTML=`<span class=bad>${e.message}</span>`;running=false}busy=false}requestAnimationFrame(step)}
$("go").onclick=async()=>{try{$("go").disabled=true;$("status").textContent="Camera…";let s=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:960},height:{ideal:1280}},audio:false});v.srcObject=s;await v.play();$("status").textContent="Scarico RTMW3D (~369 MB), attendi…";ses=await ort.InferenceSession.create(MODEL,{executionProviders:["webgpu","wasm"],graphOptimizationLevel:"all"});$("status").innerHTML='<span class=ok>RTMW3D PRONTO ✓</span>';running=true;requestAnimationFrame(step)}catch(e){$("status").innerHTML=`<span class=bad>Avvio fallito: ${e.message}</span>`;$("go").disabled=false}};
</script></body></html>
