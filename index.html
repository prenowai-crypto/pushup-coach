<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#07090d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.webmanifest"><title>Push-Up Coach V2</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#07090d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;overscroll-behavior:none}.app{min-height:100svh;max-width:900px;margin:auto;padding:max(10px,env(safe-area-inset-top)) 10px max(12px,env(safe-area-inset-bottom))}.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}.top h1{font-size:19px;margin:0}.pill{font-size:12px;background:#1b2029;padding:7px 10px;border-radius:99px}.stage{position:relative;width:100%;height:min(64svh,650px);background:#10141b;border-radius:20px;overflow:hidden}video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}canvas{pointer-events:none}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;pointer-events:none}.badge{padding:8px 11px;border-radius:12px;background:#000a;backdrop-filter:blur(8px);font-weight:700;font-size:12px}.repBig{position:absolute;right:12px;bottom:12px;background:#000b;border-radius:18px;padding:8px 16px;text-align:center}.repBig b{font-size:48px;line-height:1}.repBig span{display:block;font-size:10px;opacity:.65}.guide{position:absolute;left:12px;bottom:12px;max-width:58%;font-size:12px;padding:9px 11px;background:#000a;border-radius:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px}.card{background:#131821;border-radius:14px;padding:10px;text-align:center}.card small{display:block;color:#8e98a8;font-size:10px;text-transform:uppercase}.card b{display:block;font-size:20px;margin-top:3px}.feedback{margin-top:8px;border-radius:14px;background:#131821;padding:12px 14px;min-height:48px;font-size:14px}.controls{display:grid;grid-template-columns:2fr 1fr 1fr;gap:7px;margin-top:8px}button{border:0;border-radius:13px;padding:13px 8px;font-weight:750;font-size:14px;background:#202735;color:white}#start{background:#fff;color:#080a0d}.ok{background:#123922!important}.warn{background:#493514!important}.err{background:#4b1c20!important}@media(max-width:500px){.stage{height:59svh}.repBig b{font-size:42px}.grid{grid-template-columns:repeat(3,1fr)}.card b{font-size:18px}}
</style></head><body><main class="app"><div class="top"><h1>Push-Up Coach V2</h1><div id="status" class="pill">Pronto</div></div><section class="stage" id="stage"><video id="video" playsinline muted autoplay></video><canvas id="canvas"></canvas><div class="hud"><div id="phase" class="badge">READY</div><div id="fps" class="badge">0 FPS</div></div><div class="guide" id="guide">📱 Telefono di lato. Inquadra tutto il corpo.</div><div class="repBig"><b id="reps">0</b><span>RIPETIZIONI</span></div></section><div class="grid"><div class="card"><small>Gomito</small><b id="elbow">--°</b></div><div class="card"><small>Linea corpo</small><b id="body">--°</b></div><div class="card"><small>Tempo rep</small><b id="tempo">--</b></div></div><div id="feedback" class="feedback">Premi Avvia e consenti l'accesso alla fotocamera.</div><div class="controls"><button id="start">AVVIA</button><button id="camera">CAMERA</button><button id="reset">RESET</button></div></main>
<script type="module">
import{PoseLandmarker,FilesetResolver,DrawingUtils}from'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.32/+esm';
const $=id=>document.getElementById(id),video=$('video'),canvas=$('canvas'),ctx=canvas.getContext('2d'),status=$('status'),phaseEl=$('phase'),fpsEl=$('fps'),repsEl=$('reps'),elbowEl=$('elbow'),bodyEl=$('body'),tempoEl=$('tempo'),feedback=$('feedback');
const CFG={up:155,bottom:100,bodyGood:158,visibility:.45,minRep:650,maxRep:6000,smooth:.55,bottomFrames:2};
let pose,stream,running=false,facing='environment',reps=0,state='READY',smoothElbow=null,smoothBody=null,repStart=0,bottomCount=0,lastVideoTime=-1,lastFrame=performance.now(),frames=0;
function msg(t,type=''){feedback.textContent=t;feedback.className='feedback '+type}function stat(t,type=''){status.textContent=t;status.className='pill '+type}
function angle(a,b,c){const u=[a.x-b.x,a.y-b.y,(a.z||0)-(b.z||0)],v=[c.x-b.x,c.y-b.y,(c.z||0)-(b.z||0)];const dot=u[0]*v[0]+u[1]*v[1]+u[2]*v[2],mu=Math.hypot(...u),mv=Math.hypot(...v);return Math.acos(Math.max(-1,Math.min(1,dot/(mu*mv||1))))*180/Math.PI}function sm(prev,x){return prev==null?x:prev*CFG.smooth+x*(1-CFG.smooth)}
async function initAI(){if(pose)return;stat('Carico AI…');const vision=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.32/wasm');pose=await PoseLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task',delegate:'GPU'},runningMode:'VIDEO',numPoses:1,minPoseDetectionConfidence:.5,minPosePresenceConfidence:.5,minTrackingConfidence:.5});stat('AI pronta','ok')}
async function start(){try{await initAI();if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:facing},width:{ideal:1280},height:{ideal:720},frameRate:{ideal:30,max:30}}});video.srcObject=stream;await video.play();canvas.width=video.videoWidth;canvas.height=video.videoHeight;running=true;stat('Camera attiva','ok');$('start').textContent='RIAVVIA';requestAnimationFrame(loop)}catch(e){console.error(e);stat('Camera bloccata','err');msg('Safari non ha aperto la fotocamera. Controlla Impostazioni → Safari → Fotocamera e ricarica la pagina.','err')}}
function pickSide(p){const idsL=[11,13,15,23,27],idsR=[12,14,16,24,28];const score=ids=>ids.reduce((s,i)=>s+(p[i].visibility||0),0);const ids=score(idsL)>=score(idsR)?idsL:idsR;return ids.map(i=>p[i])}
function analyze(p){const [shoulder,elbow,wrist,hip,ankle]=pickSide(p);if([shoulder,elbow,wrist,hip,ankle].some(x=>(x.visibility||0)<CFG.visibility)){phaseEl.textContent='POSIZIONATI';msg('Mostra tutto il profilo: spalla, gomito, polso, anca e caviglia.','warn');return}smoothElbow=sm(smoothElbow,angle(shoulder,elbow,wrist));smoothBody=sm(smoothBody,angle(shoulder,hip,ankle));elbowEl.textContent=Math.round(smoothElbow)+'°';bodyEl.textContent=Math.round(smoothBody)+'°';const now=performance.now();if(state==='READY'){if(smoothElbow>=CFG.up){state='UP';msg('Posizione iniziale rilevata. Scendi controllato.','ok')}}else if(state==='UP'){if(smoothElbow<145){state='DOWN';repStart=now;bottomCount=0}}else if(state==='DOWN'){if(smoothElbow<=CFG.bottom){bottomCount++;if(bottomCount>=CFG.bottomFrames){state='BOTTOM';msg(smoothBody>=CFG.bodyGood?'Profondità raggiunta. Ora spingi.':'Profondità OK, ma tieni il corpo più allineato.',smoothBody>=CFG.bodyGood?'ok':'warn')}else if(smoothElbow>=CFG.up){state='UP';msg('Rep non contata: scendi di più.','warn')}}else if(state==='BOTTOM'){if(smoothElbow>CFG.bottom+8)state='ASCESA'}else if(state==='ASCESA'){if(smoothElbow>=CFG.up){const dur=now-repStart;if(dur>=CFG.minRep&&dur<=CFG.maxRep){reps++;repsEl.textContent=reps;tempoEl.textContent=(dur/1000).toFixed(1)+'s';msg(smoothBody>=CFG.bodyGood?'✓ Rep valida':'✓ Rep contata — migliora l’allineamento',smoothBody>=CFG.bodyGood?'ok':'warn')}state='UP'}else if(smoothElbow<=CFG.bottom)state='BOTTOM'}phaseEl.textContent=state}
function draw(p){ctx.clearRect(0,0,canvas.width,canvas.height);if(!p)return;const d=new DrawingUtils(ctx);ctx.save();ctx.translate(canvas.width,0);ctx.scale(-1,1);d.drawConnectors(p,PoseLandmarker.POSE_CONNECTIONS,{lineWidth:3});d.drawLandmarks(p,{radius:4});ctx.restore()}
function loop(now){if(!running)return;if(video.readyState>=2&&video.currentTime!==lastVideoTime){lastVideoTime=video.currentTime;const r=pose.detectForVideo(video,now),p=r.landmarks?.[0];draw(p);if(p)analyze(p);else{phaseEl.textContent='NESSUN CORPO';msg('Non vedo il corpo. Allontana il telefono e resta completamente nell’inquadratura.','warn')}}frames++;if(now-lastFrame>=1000){fpsEl.textContent=frames+' FPS';frames=0;lastFrame=now}requestAnimationFrame(loop)}
$('start').onclick=start;$('camera').onclick=async()=>{facing=facing==='environment'?'user':'environment';await start()};$('reset').onclick=()=>{reps=0;state='READY';smoothElbow=smoothBody=null;bottomCount=0;repsEl.textContent='0';elbowEl.textContent=bodyEl.textContent='--°';tempoEl.textContent='--';phaseEl.textContent='READY';msg('Reset completato. Parti con le braccia distese.')};
</script></body></html>
