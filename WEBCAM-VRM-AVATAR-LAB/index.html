<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Webcam VRM Avatar Lab V1</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#071019;color:#eef;font:14px system-ui;padding:16px}h1{margin:0 0 5px;font-size:21px}.muted{color:#9fb1c0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}@media(max-width:800px){.grid{grid-template-columns:1fr}}
.card{background:#101a24;border:1px solid #26394a;border-radius:14px;padding:10px;min-height:300px}.stage{position:relative;aspect-ratio:3/4;max-height:70vh}video,canvas{width:100%;height:100%;object-fit:cover;border-radius:10px;background:#000}.mirror{transform:scaleX(-1)}
button{padding:10px 14px;border:0;border-radius:9px;font-weight:750;margin:5px 4px 5px 0}.go{background:#50dc91}.stop{background:#ef7474}.chip{display:inline-block;padding:5px 8px;border-radius:8px;background:#172736;margin:3px}.ok{color:#56e49b}.bad{color:#ff7777}pre{white-space:pre-wrap;background:#081119;padding:9px;border-radius:9px;max-height:150px;overflow:auto}
</style>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/pose.js"></script>
<script src="https://cdn.jsdelivr.net/npm/kalidokit@1.1.5/dist/kalidokit.umd.js"></script>
</head><body>
<h1>Webcam → VRM Avatar Lab V1</h1>
<div class="muted">Test isolato. MediaPipe Pose + Kalidokit + VRM. Nessuna logica Gym Coach.</div>
<button id="start" class="go">AVVIA</button><button id="stop" class="stop">STOP</button>
<span class="chip" id="cam">CAM —</span><span class="chip" id="pose">POSE —</span><span class="chip" id="vrm">VRM —</span><span class="chip" id="fps">FPS —</span>
<div class="grid">
 <div class="card"><b>WEBCAM</b><div class="stage"><video id="video" class="mirror" autoplay playsinline muted></video></div></div>
 <div class="card"><b>AVATAR 3D</b><div class="stage" id="avatarStage"></div></div>
</div>
<pre id="log">Carico avatar CC0 Avatar Orion…</pre>

<script type="module">
import * as THREE from "https://esm.sh/three@0.180.0";
import {GLTFLoader} from "https://esm.sh/three@0.180.0/examples/jsm/loaders/GLTFLoader.js";
import {OrbitControls} from "https://esm.sh/three@0.180.0/examples/jsm/controls/OrbitControls.js";
import {VRMLoaderPlugin,VRMUtils} from "https://esm.sh/@pixiv/three-vrm@3.4.4?external=three";

const $=x=>document.getElementById(x),video=$("video"),stage=$("avatarStage");
const log=s=>$("log").textContent=s+"\n"+$("log").textContent.slice(0,2500);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));stage.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x0b1219);
const camera=new THREE.PerspectiveCamera(30,1,.1,20);camera.position.set(0,1.25,4.5);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,1,0);controls.enableDamping=true;
scene.add(new THREE.HemisphereLight(0xffffff,0x334455,2.3));const dl=new THREE.DirectionalLight(0xffffff,2.2);dl.position.set(2,4,3);scene.add(dl);
scene.add(new THREE.GridHelper(5,10,0x456070,0x22303a));
let currentVrm=null,stream=null,running=false,busy=false,lastPose=0,frames=0,fpsT=performance.now();

function resize(){const r=stage.getBoundingClientRect(),w=Math.max(260,r.width),h=Math.max(320,r.height);renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
addEventListener("resize",resize);resize();

const loader=new GLTFLoader();loader.crossOrigin="anonymous";loader.register(p=>new VRMLoaderPlugin(p));
const AVATAR="https://raw.githubusercontent.com/madjin/vrm-samples/master/Avatar_Orion.vrm";
try{
 const gltf=await loader.loadAsync(AVATAR);currentVrm=gltf.userData.vrm;
 VRMUtils.removeUnnecessaryJoints(currentVrm.scene);
 if(currentVrm.meta?.metaVersion==="0") VRMUtils.rotateVRM0(currentVrm);
 currentVrm.scene.traverse(o=>o.frustumCulled=false);scene.add(currentVrm.scene);
 currentVrm.scene.position.set(0,0,0);$("vrm").textContent="VRM OK";$("vrm").classList.add("ok");log("Avatar Orion caricato.");
}catch(e){$("vrm").textContent="VRM ERRORE";$("vrm").classList.add("bad");log("VRM: "+e.message)}

function rot(name,v,damp=1){
 if(!currentVrm||!v)return;const n=currentVrm.humanoid.getNormalizedBoneNode(name);if(!n)return;
 const q=new THREE.Quaternion().setFromEuler(new THREE.Euler(v.x||0,v.y||0,v.z||0,"XYZ"));
 n.quaternion.slerp(q,.45*damp);
}
function applyRig(r){
 if(!r||!currentVrm)return;
 rot("hips",r.Hips?.rotation,.45);rot("spine",r.Spine,.45);rot("chest",r.Spine,.28);rot("upperChest",r.Spine,.20);
 rot("leftUpperArm",r.LeftUpperArm);rot("leftLowerArm",r.LeftLowerArm);rot("leftHand",r.LeftHand,.7);
 rot("rightUpperArm",r.RightUpperArm);rot("rightLowerArm",r.RightLowerArm);rot("rightHand",r.RightHand,.7);
 rot("leftUpperLeg",r.LeftUpperLeg,.8);rot("leftLowerLeg",r.LeftLowerLeg,.8);rot("leftFoot",r.LeftFoot,.6);
 rot("rightUpperLeg",r.RightUpperLeg,.8);rot("rightLowerLeg",r.RightLowerLeg,.8);rot("rightFoot",r.RightFoot,.6);
 currentVrm.humanoid.update();
}
const pose=new Pose({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/${f}`});
pose.setOptions({modelComplexity:1,smoothLandmarks:true,enableSegmentation:false,minDetectionConfidence:.5,minTrackingConfidence:.5});
pose.onResults(res=>{
 busy=false;if(!running)return;
 if(res.poseLandmarks&&res.poseWorldLandmarks){
  $("pose").textContent="POSE OK";$("pose").classList.add("ok");
  const rig=Kalidokit.Pose.solve(res.poseWorldLandmarks,res.poseLandmarks,{runtime:"mediapipe",video,enableLegs:true});
  applyRig(rig);frames++;
 }
});
async function pump(){
 if(!running)return;
 if(!busy&&video.readyState>=2){busy=true;try{await pose.send({image:video})}catch(e){busy=false;log("Pose: "+e.message)}}
 requestAnimationFrame(pump);
}
$("start").onclick=async()=>{
 try{
  if(!stream){stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:960},height:{ideal:1280}},audio:false});video.srcObject=stream;await video.play()}
  $("cam").textContent="CAM OK";$("cam").classList.add("ok");running=true;pump();
 }catch(e){$("cam").textContent="CAM ERRORE";$("cam").classList.add("bad");log(e.message)}
};
$("stop").onclick=()=>{running=false};
const clock=new THREE.Clock();
function render(){
 requestAnimationFrame(render);resize();controls.update();if(currentVrm)currentVrm.update(clock.getDelta());renderer.render(scene,camera);
 const now=performance.now();if(now-fpsT>1000){$("fps").textContent=`FPS POSE ${frames}`;frames=0;fpsT=now}
}render();
</script></body></html>
